name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip same-repo PRs (already built on the push). Still build fork PRs.
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew assemble --no-daemon

      - name: Prepare JAR
        id: jar
        run: |
          mkdir -p dist
          fat_jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-all.jar' | head -n 1)"
          if [ -z "$fat_jar" ]; then
            echo "No plugin jar found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          cp "$fat_jar" dist/AxiomPaper.jar
          cp "$fat_jar" "dist/$(basename "$fat_jar")"
          echo "Built $(basename "$fat_jar") ($(du -h dist/AxiomPaper.jar | cut -f1))"
          echo "path=dist/AxiomPaper.jar" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomPaper
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          files: dist/*.jar
          fail_on_unmatched_files: true
          body: |
            Automated plugin build from `${{ github.ref_name }}`.

            | | |
            |---|---|
            | Commit | ${{ github.sha }} |
            | Branch | `${{ github.ref_name }}` |
            | Workflow | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Download **AxiomPaper.jar** and drop it in your server `plugins` folder.

      - name: Publish tagged GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
